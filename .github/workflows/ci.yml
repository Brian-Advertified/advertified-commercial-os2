name: Advertified CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advertified-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AWS_BEDROCK_ENABLED: "false"
  AI_COST_CAP_MINOR: "0"

jobs:
  architecture:
    name: Architecture guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest==7.4.3
      - name: Enforce repository boundaries
        run: python -m pytest tests/architecture -q

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  commercial-api:
    name: C# Commercial API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore test graph
        run: >-
          dotnet restore
          api/tests/Advertified.Commercial.Api.Tests/Advertified.Commercial.Api.Tests.csproj
      - name: Build API
        run: dotnet build api/Advertified.Commercial.Api.csproj --configuration Release --no-restore
      - name: Test API
        run: >-
          dotnet test
          api/tests/Advertified.Commercial.Api.Tests/Advertified.Commercial.Api.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

  agent-runtime:
    name: Python agent runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-runtime/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  infrastructure:
    name: PostgreSQL and local services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build PostgreSQL with spatial and vector extensions
        run: docker compose build postgres
      - name: Start healthy local services
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Verify PostgreSQL version and extensions
        run: |
          server_version="$(docker compose exec -T postgres psql -U advertified -d advertified -Atc "SHOW server_version_num;")"
          docker compose exec -T postgres psql -U advertified -d advertified -v ON_ERROR_STOP=1 -f /opt/advertified/verify-extensions.sql
          case "$server_version" in
            16*) ;;
            *) echo "Expected PostgreSQL 16, found $server_version"; exit 1 ;;
          esac
      - name: Capture diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Stop local services
        if: always()
        run: docker compose down
