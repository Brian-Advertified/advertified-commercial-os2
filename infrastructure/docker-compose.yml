name: advertified-os2-dev

services:
  postgres:
    build:
      context: ./postgres
    image: advertified/postgres-dev:16-postgis3-pgvector0.8.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advertified}
      POSTGRES_USER: ${POSTGRES_USER:-advertified}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./verify-extensions.sql:/opt/advertified/verify-extensions.sql:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/advertified-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-advertified-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-advertified-local-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
  redis_data:
