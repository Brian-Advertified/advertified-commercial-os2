name: advertified-os2-dev

services:
  postgres:
    build:
      context: ./postgres
    image: advertified/postgres-dev:16-postgis3-pgvector0.8.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advertified}
      POSTGRES_USER: ${POSTGRES_USER:-advertified}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./verify-extensions.sql:/opt/advertified/verify-extensions.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-advertified} -d ${POSTGRES_DB:-advertified} &&
          psql -U ${POSTGRES_USER:-advertified} -d ${POSTGRES_DB:-advertified}
          -v ON_ERROR_STOP=1 -f /opt/advertified/verify-extensions.sql
          >/dev/null &&
          psql -U ${POSTGRES_USER:-advertified} -d ${POSTGRES_DB:-advertified}
          -Atc "SHOW server_version_num;" | grep -Eq '^16'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-advertified-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-advertified-local-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-53310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.30.0@sha256:061d35c03611bc15b73d024c8e8387bcf0624279f8b57c16c1567326f214ba56
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-advertified-docling-local-only}
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "127.0.0.1:${DOCLING_PORT:-55001}:5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  redis_data:
