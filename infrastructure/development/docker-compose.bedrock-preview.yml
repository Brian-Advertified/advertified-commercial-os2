services:
  agent-runtime:
    environment:
      ADVERTIFIED_AGENT_RUNTIME_MODE: bedrock
      ADVERTIFIED_BEDROCK_REGION: us-east-1
      ADVERTIFIED_BEDROCK_MODEL_ALLOWLIST: global.anthropic.claude-haiku-4-5-20251001-v1:0
      ADVERTIFIED_BEDROCK_MULTIMODAL_MODEL_ALLOWLIST: global.anthropic.claude-haiku-4-5-20251001-v1:0
      ADVERTIFIED_BEDROCK_PRICING_JSON: '{"global.anthropic.claude-haiku-4-5-20251001-v1:0":{"input_per_million_usd":"1.0","output_per_million_usd":"5.0"}}'
      ADVERTIFIED_BEDROCK_MAX_TOKENS: "8192"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_CONFIG_FILE: /tmp/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /tmp/.aws/credentials
      AWS_PROFILE: ${AWS_PROFILE:-default}
      HOME: /tmp
    # Refresh writes only to tmpfs; never make the host credential directory writable.
    command: ["python", "/app/preview_sso_bootstrap.py"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${USERPROFILE}/.aws:/run/advertified-aws:ro
      - ../tools/preview_sso_bootstrap.py:/app/preview_sso_bootstrap.py:ro
  api:
    volumes:
      - ./development/appsettings.bedrock-preview.json:/app/appsettings.Development.json:ro
    environment:
      SuppliedBrief__Mode: Http
      InventorySemantic__Enabled: "false"
      InventorySemantic__ModelId: amazon.nova-lite-v1:0
      InventorySemantic__InputPricePerMillionTokensUsdMicros: "60000"
      InventorySemantic__OutputPricePerMillionTokensUsdMicros: "240000"
      InventorySemantic__PerCallCostCapUsdMicros: "10000"
      InventorySemantic__CertificationBudgetUsdMicros: "2000000"
      InventorySemantic__BudgetScope: governed-production-preview-2026-09-07
      InventorySemantic__PromptVersion: 5.0.0
      InventorySemantic__MaximumOutputTokensPerChunk: "1024"
      AgentRuntime__Mode: Http
      AgentRuntime__Provider: bedrock
      AgentRuntime__DefaultModel: global.anthropic.claude-haiku-4-5-20251001-v1:0
      # Development preview: Claude Haiku 4.5 is the only live model for this production-behaviour certification.
      # Exact provider/model/token/USD usage remains ledgered per invocation; no silent model fallback is allowed.
      AgentRuntime__DefaultCostCapMinor: "4"
      AgentRuntime__CostCapsMinor__audience_intelligence: "6"
      AgentRuntime__CostCapsMinor__media_strategy: "3"
      AgentRuntime__AllowLive: "true"
      AgentRuntime__MaxAttempts: "1"
      AgentRuntime__TimeoutSeconds: "120"
