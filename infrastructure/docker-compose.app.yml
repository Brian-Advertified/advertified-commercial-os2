name: advertified-os2-dev

services:
  database-role-bootstrap:
    image: advertified/postgres-dev:16-postgis3-pgvector0.8.6
    entrypoint: ["psql"]
    command:
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /opt/advertified/init-scripts/02-provision-database-roles.sql
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: advertified
      PGUSER: advertified
      PGPASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    volumes:
      - ./init-scripts:/opt/advertified/init-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrator:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: migrator
    image: advertified/commercial-migrator-dev:local
    command: ["--apply"]
    environment:
      ADVERTIFIED_MIGRATION_CONNECTION_STRING: Host=postgres
      PGPORT: "5432"
      PGDATABASE: advertified
      PGUSER: advertified
      PGPASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    depends_on:
      database-role-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  development-seed:
    image: advertified/postgres-dev:16-postgis3-pgvector0.8.6
    entrypoint: ["psql"]
    command:
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /opt/advertified/development/seed-local-workspace.sql
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: advertified
      PGUSER: advertified
      PGPASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    volumes:
      - ./development:/opt/advertified/development:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: "no"

  development-inventory-seed:
    image: advertified/postgres-dev:16-postgis3-pgvector0.8.6
    entrypoint: ["psql"]
    command:
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /opt/advertified/development/seed-local-inventory.sql
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: advertified
      PGUSER: advertified
      PGPASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
    volumes:
      - ./development:/opt/advertified/development:ro
    depends_on:
      development-seed:
        condition: service_completed_successfully
    restart: "no"

  agent-runtime:
    build:
      context: ..
      dockerfile: agent-runtime/Dockerfile
    image: advertified/agent-runtime-dev:local
    environment:
      ADVERTIFIED_AGENT_RUNTIME_MODE: deterministic
      ADVERTIFIED_INVENTORY_PROCESSING_PAUSED: "true"
      ADVERTIFIED_AGENT_RUNTIME_SERVICE_KEY: advertified-agent-runtime-local-only
    ports:
      - "127.0.0.1:5098:8080"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: api
    image: advertified/commercial-api-dev:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__Console__FormatterName: simple
      Logging__Console__FormatterOptions__SingleLine: "true"
      Process__Role: Combined
      ConnectionStrings__CommercialDatabase: Host=postgres
      ConnectionStrings__WorkerSchedulerDatabase: Host=postgres
      PGPORT: "5432"
      PGDATABASE: advertified
      PGUSER: advertified
      PGPASSWORD: ${POSTGRES_PASSWORD:-advertified-local-only}
      Authentication__Mode: DeterministicSession
      Authentication__DevelopmentIdentity__UserId: ${ADVERTIFIED_DEV_USER_ID:-10000000-0000-0000-0000-000000000001}
      Authentication__DevelopmentIdentity__ActorId: ${ADVERTIFIED_DEV_ACTOR_ID:-10000000-0000-0000-0000-000000000001}
      Authentication__DevelopmentIdentity__IdentityType: human
      Certification__CampaignUtcNow: ${ADVERTIFIED_CERTIFICATION_CAMPAIGN_UTC:-2026-11-01T12:00:00Z}
      Authentication__BrowserSession__SecureCookie: "false"
      Authentication__BrowserSession__AllowedOrigins__0: http://localhost:3017
      Authentication__BrowserSession__AllowedOrigins__1: http://127.0.0.1:3017
      # Development-only headroom for connected browser certification. Production keeps
      # the bounded defaults in RequestRateLimitPolicies.
      RateLimits__BusinessReadPermitLimit: "5000"
      RateLimits__BusinessMutationPermitLimit: "1000"
      RateLimits__BrowserSessionPermitLimit: "500"
      RateLimits__BrowserSessionStatusPermitLimit: "1000"
      RateLimits__AgentWorkPermitLimit: "500"
      RateLimits__HeavyWorkPermitLimit: "500"
      InventoryProtection__ObjectStoreMode: Minio
      InventoryProtection__ScannerMode: Deterministic
      InventoryProtection__Endpoint: minio:9000
      InventoryProtection__AccessKey: ${MINIO_ROOT_USER:-advertified-local}
      InventoryProtection__SecretKey: ${MINIO_ROOT_PASSWORD:-advertified-local-only}
      InventoryProtection__Bucket: advertified-inventory
      InventoryProtection__UseTls: "false"
      InventoryExtraction__Mode: Deterministic
      InventoryProcessing__Paused: "true"
      # Owner accepted these public OSM service policies for this single-instance dev app, 2026-09-08.
      # Do not copy this activation into production or a multi-replica deployment.
      LocationIntelligence__Discovery__PublicServicePolicyAccepted: "true"
      LocationIntelligence__Discovery__UserAgent: Advertified-Commercial-OS2-Development/1.0
      LocationIntelligence__PoiDiscovery__PublicServicePolicyAccepted: "true"
      LocationIntelligence__PoiDiscovery__UserAgent: Advertified-Commercial-OS2-Development/1.0
      WorkerDispatch__InventoryExtractionMaxConcurrency: "1"
      InventoryEmbedding__Mode: Deterministic
      AgentRuntime__Mode: HttpDeterministic
      AgentRuntime__Provider: deterministic
      AgentRuntime__DefaultModel: fixture-v1
      AgentRuntime__DefaultCostCapMinor: "0"
      AgentRuntime__CostCapsMinor__media_strategy: "0"
      AgentRuntime__AllowLive: "false"
      AgentRuntime__MaxAttempts: "1"
      AgentRuntime__BaseUrl: http://agent-runtime:8080
      AgentRuntime__ServiceKey: advertified-agent-runtime-local-only
      EmailAutomation__Mode: Deterministic
      EmailAutomation__SenderAddress: noreply@advertified.com
      EmailAutomation__ProcessInline: "false"
    ports:
      - "127.0.0.1:5097:8080"
    depends_on:
      development-seed:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: advertified/web-dev:local
    environment:
      ADVERTIFIED_API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:3017:8080"
    depends_on:
      api:
        condition: service_healthy
